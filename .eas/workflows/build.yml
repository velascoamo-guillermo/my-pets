name: Preview deploy

on:
  push:
    branches:
      - main

jobs:
  checks:
    name: TypeScript & Unit Tests
    type: custom
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  fingerprint:
    name: Fingerprint
    type: fingerprint

  get_e2e_build:
    name: Check existing E2E build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: e2e

  build_e2e:
    name: Build E2E
    needs: [get_e2e_build]
    if: ${{ !needs.get_e2e_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: e2e

  maestro_tests:
    name: Run E2E tests
    needs: [get_e2e_build, build_e2e]
    type: maestro
    params:
      build_id: ${{ needs.build_e2e.outputs.build_id || needs.get_e2e_build.outputs.build_id }}
      flow_path:
        - .maestro/pet-list.yaml
        - .maestro/create-pet.yaml
        - .maestro/pet-detail.yaml
        - .maestro/create-visit.yaml

  get_ios_build:
    name: Check existing iOS build
    needs: [fingerprint, checks, maestro_tests]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: preview

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview

  update_ios:
    name: Publish OTA update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      channel: preview
      platform: ios

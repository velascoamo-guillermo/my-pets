appId: com.guillermo.velasco.amo.mypets
---
# Tap the test pet card
- tapOn:
    text: "Test Pet"

# Wait for detail screen to load
- extendedWaitUntil:
    visible:
      id: "pet-detail-screen"
    timeout: 5000

# Scroll all the way to verify delete button exists
- scrollUntilVisible:
    element:
      id: "delete-pet-button"
    timeout: 10000

# Verify visits section exists
- scrollUntilVisible:
    element:
      text: "Upcoming Visits"
    timeout: 3000

- assertVisible:
    id: "add-visit-button"
